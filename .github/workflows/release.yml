name: Release

# Builds the binaries for a tag and attaches them to its release.
#
# Normally release-please calls this after merging a release PR, having already
# chosen the version and created the release. A hand-pushed v* tag still works
# and creates the release itself, which is what makes an out-of-band release
# possible without waiting on a bot.
#
# The version and the thing to check out are separate inputs. The tag is created
# with the release, so it would usually resolve -- but a tag is a ref that has to
# propagate, and the commit release-please reports is exact and available the
# moment the release exists. There is nothing to gain by depending on the slower
# of the two.
#
# There is a window between the release appearing and the binaries being on it,
# during which its asset URLs are 404s. That is why the install instructions use
# `curl -fLO`, which writes no file when the server says no. Closing the window
# by publishing as a draft was tried and reverted: a draft release has no tag,
# release-please identifies its own last release by tag, and without one it
# reconsidered the entire history and proposed a minor bump containing every
# commit ever made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build and attach, e.g. v1.2.3'
        required: true
        type: string
      ref:
        description: 'Commit to build from. Defaults to the tag.'
        required: false
        type: string
  # Called by release-please, which has created the release and needs the
  # binaries attached to it.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ref:
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit when the caller knows it, the tag otherwise.
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          # Full history: nothing needs it today, but a shallow checkout is a
          # trap for anything that later reaches for git describe.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # A release is not the place to discover a broken build. CI has run
      # these on the commit already; running them again costs two minutes and
      # removes the case where a tag is pushed at something that never passed.
      - name: verify
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo 'gofmt: files need formatting'; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

      - name: build
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          echo "Building $version"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "ps2hdd-linux-${arch}" ./cmd/ps2hdd
          done
          # Confirm the version actually reached the binary. The ldflag path
          # is easy to break silently -- it targets main.version, and a rename
          # would leave every release reporting "dev" with nothing failing.
          got=$(./ps2hdd-linux-amd64 --version)
          echo "$got"
          case "$got" in
            *"$version"*) ;;
            *) echo "the binary reports '$got', which does not contain '$version'"; exit 1 ;;
          esac
          sha256sum ps2hdd-linux-amd64 ps2hdd-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"

          install_notes=$(cat <<NOTES
          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh -s -- ${version}
          \`\`\`

          The script checks the architecture and the checksum, waits out a
          download that is not there yet, and does all of its work inside a
          function called on its last line, so a transfer cut partway runs
          nothing. Save and read it first if you would rather.

          Or by hand:

          \`\`\`sh
          base=https://github.com/${{ github.repository }}/releases/download/${version}
          curl -fLO --retry 3 \$base/ps2hdd-linux-amd64
          curl -fLO --retry 3 \$base/SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          sudo install -m0755 ps2hdd-linux-amd64 /usr/local/bin/ps2hdd
          \`\`\`

          \`-f\` is not decoration. Without it curl writes the server's error page
          to the file, and \`install\` will happily mark nine bytes of \`Not Found\`
          executable; the first thing you see is a shell trying to run it. With
          \`-f\` a failed download leaves no file and says so.

          Use \`ps2hdd-linux-arm64\` on aarch64. \`/usr/local/bin\` matters: sudo's
          \`secure_path\` does not include \`~/.local/bin\` or Homebrew, and ps2hdd
          needs raw block device access, so a binary anywhere else is invisible to
          exactly the runs that need it.

          Reading a PS2 HDD needs no external tools. Installing games needs
          \`hdl_dump\`, and artwork or PS1 support needs \`pfsfuse\`; run
          \`ps2hdd doctor\` and it prints the commands for your distribution.
          NOTES
          )

          # release-please creates the release itself, with the changelog as
          # its body, and then calls this workflow to hang the binaries off it.
          # A hand-pushed tag arrives here with no release at all. Both are
          # normal, so which one happened is decided by looking rather than by
          # assuming, and the install instructions are put in front of whatever
          # notes already exist rather than replacing them.
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release $version exists; attaching binaries"
            gh release upload "$version" \
              ps2hdd-linux-amd64 ps2hdd-linux-arm64 SHA256SUMS --clobber
            body=$(gh release view "$version" --json body --jq .body)
            case "$body" in
              *"## Install"*) echo "install notes already present" ;;
              *) printf '%s\n\n%s\n' "$install_notes" "$body" |
                   gh release edit "$version" --notes-file - ;;
            esac
            # A no-op on a release that is already published, and the recovery
            # path for one left as a draft by the version of this that made
            # them that way.
            gh release edit "$version" --draft=false --latest
          else
            echo "no release for $version; creating one"
            gh release create "$version" \
              --title "$version" \
              --generate-notes \
              --notes-file - \
              ps2hdd-linux-amd64 ps2hdd-linux-arm64 SHA256SUMS <<<"$install_notes"
          fi
